# 4G, not 2G: compileProductionExecutableKotlinJs for a Compose-UI-on-canvas js target bundles skiko
# and does not fit in 2048m. At 2G it fails as OutOfMemoryError in :uwidgets and, in
# :uwidgets-demo-app, as a back-end CompilationException pointing at Compose's InteropView.web.kt --
# which looks like a compiler bug and is not one. Measured 2026-09-17: both pass at 4096m.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
kotlin.code.style=official
kotlin.js.generate.executable.default=false
kotlin.mpp.stability.nowarn=true
org.jetbrains.compose.experimental.jscanvas.enabled=true
android.useAndroidX=true
# Configuration cache: a --no-daemon stage of `gndx gradle run` reuses the entry from disk, which cut
# `help` from 17s to 8s and `build -m` from 21s to 11s here (luagnd docs/track/gradle-babysitter/issues/08).
org.gradle.configuration-cache=true
# Build cache: `gndx gradle run` passes --build-cache anyway; this gives Android Studio and a hand-run
# gradlew the same. A babysat clean + build here took 455s filling it and 74s (--warm) / 305s (fresh)
# from it, for ~59M in ~/.gradle/caches/build-cache-1 (luagnd docs/track/gradle-babysitter/issues/10).
org.gradle.caching=true
