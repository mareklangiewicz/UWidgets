# 4G, not 2G: compileProductionExecutableKotlinJs for a Compose-UI-on-canvas js target bundles skiko
# and does not fit in 2048m. At 2G it fails as OutOfMemoryError in :uwidgets and, in
# :uwidgets-demo-app, as a back-end CompilationException pointing at Compose's InteropView.web.kt --
# which looks like a compiler bug and is not one. Measured 2026-09-17: both pass at 4096m.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
kotlin.code.style=official
kotlin.js.generate.executable.default=false
kotlin.mpp.stability.nowarn=true
org.jetbrains.compose.experimental.jscanvas.enabled=true
android.useAndroidX=true
